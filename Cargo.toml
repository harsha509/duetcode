[package]
name = "dt"
version = "0.3.1"
edition = "2021"
description = "AI pair programming CLI — one model writes, another reviews, in a loop until approval"
license = "MIT"
repository = "https://github.com/harsha509/duetcode"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1.0.104"
ureq = { version = "2", features = ["json"] }
base64 = "0.23"
colored = "3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
termimad = "0.35.2"
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.18"
libc = "0.2.189"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
