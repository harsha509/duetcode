name: Release

on:
  push:
    tags:
      # Digits, not "v*.*.*": that glob also matched the extension's own
      # vscode-vX.Y.Z tags, so releasing the VS Code extension built and
      # published the CLI binaries under an extension tag.
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    # The repository default for GITHUB_TOKEN is read-only, which made
    # softprops/action-gh-release fail with 403 on every tag. Requested here
    # rather than by widening the repository default, so only this job can write.
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: dt
            asset_name: dt-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: dt
            asset_name: dt-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: dt
            asset_name: dt-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare asset
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          cd ../../..

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}